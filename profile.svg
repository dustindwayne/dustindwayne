<svg xmlns="http://www.w3.org/2000/svg" width="894" height="570" viewBox="0 0 894 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Dustin profile card</title>
  <desc id="desc">GitHub profile card for Dustin with dark background, subtle light effects, and clean typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="48%" stop-color="#10151d"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(742.0 102.6) rotate(90) scale(182.4 196.7)">
      <stop offset="0%" stop-color="#7c9dff" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#7c9dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160.9 484.5) rotate(90) scale(125.4 223.5)">
      <stop offset="0%" stop-color="#6fe7ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6fe7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c9dff" stop-opacity="0.0"/>
      <stop offset="45%" stop-color="#7c9dff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9cb7ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="smallBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style>
      .bgCard { fill: url(#bg); }
      .grid { fill: url(#grid); opacity: 0.42; }
      .strokeCard { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .eyebrow { font-family: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif; font-size: 13px; font-weight: 350; letter-spacing: 2.8px; fill: rgba(255,255,255,0.56); }
      .title { font-family: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: 1.8px; fill: #f4f7ff; filter: url(#shadow); }
      .subtitle { font-family: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.1px; fill: #f4f7ff; }
      .body { font-family: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 350; letter-spacing: 0.1px; fill: rgba(244,247,255,0.9); }
      .footer { font-family: 'Bahnschrift', 'DIN Alternate', 'Arial Narrow', sans-serif; font-size: 16px; font-style: italic; font-weight: 300; letter-spacing: 0.25px; fill: rgba(244,247,255,0.62); }
      .divider { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .accentLine { stroke: url(#lineGlow); stroke-width: 2.5; stroke-linecap: round; filter: url(#smallBlur); }
      .accentLineCore { stroke: #7c9dff; stroke-width: 1.2; stroke-linecap: round; opacity: 0.95; }
      .node { fill: #7c9dff; opacity: 0.9; filter: url(#smallBlur); }
      .nodeCore { fill: #ffffff; opacity: 0.95; }
    </style>
  </defs>

  <rect x="0" y="0" width="894" height="570" class="bgCard"/>
  <rect x="0" y="0" width="894" height="570" class="grid"/>
  <rect x="1" y="1" width="892" height="568" class="strokeCard"/>

  <circle cx="742.0" cy="102.6" r="156" fill="url(#glowA)" filter="url(#softBlur)"/>
  <circle cx="160.9" cy="484.5" r="124" fill="url(#glowB)" filter="url(#softBlur)"/>

  <path d="M 554.3 108.3 C 652.6 108.3, 751.0 136.8, 831.4 199.5" class="accentLine"/>
  <path d="M 554.3 108.3 C 652.6 108.3, 751.0 136.8, 831.4 199.5" class="accentLineCore"/>
  <circle cx="554.3" cy="108.3" r="7" class="node"/>
  <circle cx="554.3" cy="108.3" r="2.3" class="nodeCore"/>
  <circle cx="831.4" cy="199.5" r="7" class="node"/>
  <circle cx="831.4" cy="199.5" r="2.3" class="nodeCore"/>

  <path d="M 652.6 433.2 C 706.3 399.0, 777.8 376.2, 849.3 347.7" class="accentLine" opacity="0.7"/>
  <path d="M 652.6 433.2 C 706.3 399.0, 777.8 376.2, 849.3 347.7" class="accentLineCore" opacity="0.62"/>

  <g>
    <text x="64" y="74" class="eyebrow" text-anchor="start">
  <tspan x="64" dy="0">PROFILE / README</tspan>
</text>
    <text x="64" y="126" class="title" text-anchor="start">
  <tspan x="64" dy="0">DUSTIN</tspan>
</text>
    <text x="64" y="198" class="subtitle" text-anchor="start">
  <tspan x="64" dy="0">Father of three first. That's the most important</tspan>
  <tspan x="64" dy="26">part of who I am.</tspan>
</text>
    <line x1="64" y1="278" x2="830" y2="278" class="divider"/>
    <text x="64" y="312" class="body" text-anchor="start">
  <tspan x="64" dy="0">Autistic, self-taught, and usually building something because</tspan>
  <tspan x="64" dy="24">I got curious and couldn't leave it alone.</tspan>
</text>
    <text x="64" y="382" class="body" text-anchor="start">
  <tspan x="64" dy="0">I make games with AI, build odd little tools, and spend a lot</tspan>
  <tspan x="64" dy="24">of time messing with software, local AI, GPU stuff, 3D, and</tspan>
  <tspan x="64" dy="24">design.</tspan>
</text>
    <text x="64" y="476" class="body" text-anchor="start">
  <tspan x="64" dy="0">Most of what I know came from trying ideas, breaking them, and</tspan>
  <tspan x="64" dy="24">figuring out why.</tspan>
</text>
    <text x="64" y="540" class="footer" text-anchor="start">
  <tspan x="64" dy="0">Questionable tools. Serious intent.</tspan>
</text>
  </g>
</svg>
