<svg xmlns="http://www.w3.org/2000/svg" width="894" height="570" viewBox="0 0 894 570" role="img" aria-labelledby="title desc">
<title id="title">Dustin | About</title>
<desc id="desc">Father of three. Autistic, self-taught, making games, tools and exploring how things work.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111111"/><stop offset="0.55" stop-color="#1b1b1d"/><stop offset="1" stop-color="#232326"/></linearGradient>
 <radialGradient id="light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(821 18) rotate(132) scale(390 330)"><stop stop-color="#FF0077" stop-opacity=".15"/><stop offset=".42" stop-color="#FF0077" stop-opacity=".035"/><stop offset="1" stop-color="#FF0077" stop-opacity="0"/></radialGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="894" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FF0077"/><stop offset=".42" stop-color="#FF0077" stop-opacity=".24"/><stop offset="1" stop-color="#FF0077" stop-opacity="0"/></linearGradient>
 <style>
 text {font-family:'Bahnschrift','Arial Narrow',Arial,sans-serif}
 .eyebrow {fill:#a1a1a7;font-size:11px;font-weight:400;letter-spacing:2.7px}
 .name {fill:#f6f6f7;font-size:57px;font-weight:700;letter-spacing:.5px}
 .lead {fill:#f4f4f4;font-size:21px;font-weight:600}
 .body {fill:#c4c4c8;font-size:18px;font-weight:350}
 .closing {fill:#8d8d95;font-size:15px;font-weight:400}
 </style>
</defs>
<rect width="894" height="570" fill="url(#background)"/>
<rect width="894" height="570" fill="url(#light)"/>
<rect x=".5" y=".5" width="893" height="569" fill="none" stroke="#38383e"/>
<rect x="50" y="44" width="27" height="3" rx="1.5" fill="#FF0077"/>
<text x="89" y="48" class="eyebrow">HELLO, I'M</text>
<text x="49" y="119" class="name">DUSTIN.</text>
<text x="51" y="169" class="lead">Father of three. That's the most important part of who I am.</text>
<rect x="50" y="198" width="794" height="1" fill="#3d3d43"/>
<rect x="50" y="198" width="370" height="1.5" fill="url(#accent)"/>
<text x="50" y="241" class="body">
<tspan x="50">Autistic, self-taught, and usually building something because</tspan>
<tspan x="50" dy="26">I got curious and couldn't leave it alone.</tspan>
</text>
<text x="50" y="326" class="body">
<tspan x="50">I make games with AI, build odd little tools, and spend a lot</tspan>
<tspan x="50" dy="26">of time messing with software, local AI, GPU stuff, 3D, and design.</tspan>
</text>
<text x="50" y="411" class="body">
<tspan x="50">Most of what I know came from trying ideas, breaking them,</tspan>
<tspan x="50" dy="26">and figuring out why.</tspan>
</text>
<path d="M50 480H844" stroke="#3d3d43"/>
<text x="50" y="523" class="closing">QUESTIONABLE TOOLS. SERIOUS INTENT.</text>
<rect x="50" y="536" width="45" height="2" rx="1" fill="#FF0077"/>
</svg>
